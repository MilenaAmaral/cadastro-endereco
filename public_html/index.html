<html>
    <head>
        <title>Cadastre-se</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Framework Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <!-- Arquivo de estilo do projeto -->
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <form id="formEndereco" class="cartao-endereco mx-auto" method="POST" name="formEndereco" novalidate>
                <h2 class="titulo text-center">ENDEREÇO</h2>

                <div class="row gx-3 gy-4">
                    <!-- CEP -->
                    <div class="col-sm-6">
                        <div class="input-group">
                            <span class="input-group-text">CEP</span>
                            <input type="text" id="cep" name="cep" class="form-control" maxlength="8"
                                   inputmode="numeric" autocomplete="postal-code" required>
                        </div>
                    </div>
                    <!-- Rua -->
                    <div class="col-sm-6">
                        <div class="input-group">
                            <span class="input-group-text">Rua</span>
                            <input type="text" id="rua" name="rua" class="form-control" required>
                        </div>
                    </div>

                    <!-- Bairro -->
                    <div class="col-sm-4">
                        <div class="input-group">
                            <span class="input-group-text">Bairro</span>
                            <input type="text" id="bairro" name="bairro" class="form-control" required>
                        </div>
                    </div>
                    <!-- Cidade -->
                    <div class="col-sm-4">
                        <div class="input-group">
                            <span class="input-group-text">Cidade</span>
                            <input type="text" id="cidade" name="cidade" class="form-control" required>
                        </div>
                    </div>
                    <!-- Estado -->
                    <div class="col-sm-4">
                        <div class="input-group">
                            <span class="input-group-text">Estado</span>
                            <input type="text" id="estado" name="estado" class="form-control" maxlength="2" required>
                        </div>
                    </div>

                    <!-- Número -->
                    <div class="col-sm-5">
                        <div class="input-group">
                            <span class="input-group-text">Número</span>
                            <input type="text" id="numero" name="numero" class="form-control" placeholder="Ex: 103">
                        </div>
                    </div>
                    <!-- Complemento -->
                    <div class="col-sm-7">
                        <div class="input-group">
                            <span class="input-group-text">Complemento</span>
                            <input type="text" id="complemento" name="complemento" class="form-control">
                        </div>
                    </div>

                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-cadastrar">CADASTRAR</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Consumo da API de endereço (ViaCEP) -->
        <script src="controller.js"></script>
    </body>
</html>
